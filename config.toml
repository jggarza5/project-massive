# ─────────────────────────────────────────────
#  project-massive
#  strategy_mode: "Mean-rev", "Trend", or "Both"
# ─────────────────────────────────────────────

[database]
host     = "localhost"
port     = "6543"
dbname   = "postgres"
user     = "postgres"
password = "password"

[data]
parquet_daily   = "C:/code/python/forex-data/daily_2009_2026.parquet"
parquet_sub     = "C:/code/python/forex-data/sub_30min_2009_2026.parquet"
start_date      = "2010-01-01"
end_date        = "2026-01-01"
sub_bar_minutes = 30

[account]
initial_equity = 10000.0

# ─────────────────────────────────────────────
#  Single run
# ─────────────────────────────────────────────

[single]
label                  = "mr_atr_trigger"
strategy_mode          = "Mean-rev"   # "Mean-rev", "Trend", or "Both"
entry_donchian_period  = 20
atr_period             = 14
trigger_atr_mult       = 0.25
tp_atr_mult            = 1.0
sl_atr_mult            = 2.0
max_trades_per_day     = 3
lots                   = 0.1

# ─────────────────────────────────────────────
#  Walk-forward optimization
# ─────────────────────────────────────────────

[wfo]
strategy_mode      = "Mean-rev"   # fixed for the WFO run
is_days            = 252
oos_days           = 63
lots               = 0.1
max_trades_per_day = 3
atr_period         = 14
entry_periods      = [10, 20, 40]
trigger_atr_mults  = [0.1, 0.25, 0.5, 1.0]
tp_atr_mults       = [0.5, 1.0, 1.5, 2.0]
sl_atr_mults       = [1.0, 2.0, 3.0]

# ─────────────────────────────────────────────
#  Sweep
# ─────────────────────────────────────────────

[sweep]
strategy_mode      = "Mean-rev"
lots               = 0.1
max_trades_per_day = 3
atr_period         = 14
entry_periods      = [10, 20, 40]
trigger_atr_mults  = [0.1, 0.25, 0.5, 1.0]
tp_atr_mults       = [0.5, 1.0, 1.5, 2.0]
sl_atr_mults       = [1.0, 2.0, 3.0]
